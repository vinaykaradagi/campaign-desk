<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a0d0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Saundatti Constituency Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700&family=Noto+Sans:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column field app — header, scrolling sheet, fixed bottom tab bar; modal sheets slide from bottom on phones. */
:root{
  --bg:#f6f3f2; --surface:#ffffff; --sunk:#efe8e6; --line:#e2d7d4;
  --fg:#1f1716; --muted:#6b5e5b; --accent:#8b1c1c; --accent-fg:#ffffff; --accent-soft:#f6e1df; --brand-deep:#4a0d0d;
  --ok:#1f7a4d; --ok-soft:#dcf1e5; --bad:#b3261e; --bad-soft:#fadcd9; --warn:#9a5b00; --warn-soft:#fbecd2;
  /* opinion (diverging: my side ↔ opposite, gray midpoint) */
  --my:#1f8a4c; --neu:#e08a00; --opp:#d0342c; --unk:#e3dfeb; --on-my:#ffffff; --on-neu:#2a1800; --on-opp:#ffffff;
  --display:"Baloo Tamma 2","Noto Sans Kannada","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141011; --surface:#1d1718; --sunk:#281f20; --line:#3a2d2e;
  --fg:#f3ecea; --muted:#b3a4a1; --accent:#f08a80; --accent-fg:#2a0707; --accent-soft:#3a1d1c; --brand-deep:#2a0707;
  --ok:#6fd39c; --ok-soft:#173326; --bad:#ff8a80; --bad-soft:#3d1a18; --warn:#f0b75c; --warn-soft:#3a2b12;
  --my:#2fa463; --neu:#b8860b; --opp:#e04558; --unk:#2f2a3b; --on-my:#06140c; --on-neu:#1a1100; --on-opp:#1a0508; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--body);padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.45rem} h3{font-size:1.08rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

header.top{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:30px;height:30px;border-radius:50% 50% 50% 8px;background:var(--accent);flex:none;position:relative}
.mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.brand h1{font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.logo{width:40px;height:40px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}
.party{display:block;color:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.login-hero{background:radial-gradient(120% 90% at 50% 0%,#a32020 0%,var(--brand-deep) 70%);border-radius:16px;padding:28px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:#fff}
.login-hero img{width:150px;height:150px;border-radius:50%;box-shadow:0 10px 30px rgb(0 0 0 / .45)}
.login-hero h2{color:#fff;font-size:1.35rem}
.login-hero .pk{font-family:var(--display);font-size:1.05rem;color:#ffd9d4}
.wseg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.wseg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;font-size:.95rem}
.wseg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.wseg.sm{padding:3px}.wseg.sm button{padding:7px 6px;font-size:.88rem}
.house.done{background:var(--ok-soft)} .house .tick{color:var(--ok);font-weight:700}
.area-hn{grid-column:1/-1;color:var(--muted);font-size:.78rem;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notice-banner{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--fg);font-size:.92rem}
.notice-banner span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.folds{display:flex;flex-direction:column;gap:8px}
details.fold{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.fold>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:8px;align-items:center;font-family:var(--display);font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary span:first-child{flex:1}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-left:4px}
details.fold[open]>summary::after{transform:rotate(-135deg)}
.fold-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.fold-body>.panel{border:0;padding:12px 0 0;background:none;border-top:1px solid var(--line);border-radius:0}
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:-8px}
.panel.tight{padding:12px;gap:10px}
.panel.tight .row{gap:8px}
.opseg.sm button{padding:4px 7px;font-size:.75rem}
.voted{color:var(--ok);font-weight:700}
.acct{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;flex:none;font-size:.85rem}

main{display:flex;flex-direction:column;gap:16px;padding-block:18px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 150px;min-width:0}
.row>.fit{flex:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=tel],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:16px;color:var(--fg)}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.big{padding:12px 18px;font-size:1rem;width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.9rem;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-left:4px}
.code{font-family:var(--mono);font-size:.78rem;background:var(--sunk);border-radius:6px;padding:2px 7px;color:var(--muted)}
.note{font-size:.86rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:24px 12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h3{color:var(--fg)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-size:1.65rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.8rem;display:flex;align-items:center;gap:6px}
.tile small{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.dot.my{background:var(--my)} .dot.neutral{background:var(--neu)} .dot.opp{background:var(--opp)} .dot.unk{background:var(--unk);box-shadow:inset 0 0 0 1px var(--line)}

/* donut + legend */
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;flex:none;max-width:100%}
.donut text{fill:var(--fg);font-family:var(--display)}
.donut .lbl{fill:var(--muted);font-family:var(--body);font-size:9px}
.legend{display:flex;flex-direction:column;gap:8px;flex:1 1 200px;min-width:0;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.legend .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.86rem}
.legend .v b{color:var(--fg);font-weight:600}

/* stacked ward bars */
.wards{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.wardrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding-block:11px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.wards li:first-child .wardrow{border-top:0}
.wardrow:hover .wname{color:var(--accent)}
.wname{font-weight:600;overflow-wrap:anywhere}
.wtot{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;text-align:right}
.stack{grid-column:1/-1;display:flex;gap:2px;height:12px}
.stack i{display:block;height:100%;min-width:0}
.stack i:first-child{border-radius:4px 0 0 4px} .stack i:last-child{border-radius:0 4px 4px 0} .stack i:only-child{border-radius:4px}
.stack .my{background:var(--my)} .stack .neutral{background:var(--neu)} .stack .opp{background:var(--opp)} .stack .unk{background:var(--unk)}
.stack.empty-bar{background:var(--sunk);border-radius:4px}
.wpct{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.wpct span{display:inline-flex;align-items:center;gap:5px}

/* single-hue bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:.9rem}
.bar .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;text-align:right}
.bar .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}

/* voters */
.vlist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.voter{display:flex;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.voter:first-child{border-top:0}
.house{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-top:6px;background:var(--sunk);border-radius:8px;list-style:none}
.house .grow{flex:1 1 160px;min-width:0}
.house .opseg button{padding:5px 8px}
.v-main{flex:1 1 180px;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.v-name{font-weight:600;display:block;overflow-wrap:anywhere}
.v-main:hover .v-name{color:var(--accent)}
.v-meta{color:var(--muted);font-size:.78rem;display:block;overflow-wrap:anywhere;line-height:1.35}
.opseg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.opseg button{border:0;background:var(--surface);padding:6px 9px;font-size:.8rem;cursor:pointer;color:var(--muted);border-left:1px solid var(--line);white-space:nowrap}
.opseg button:first-child{border-left:0}
.opseg button[aria-pressed="true"][data-op="my_side"]{background:var(--my);color:var(--on-my);font-weight:600}
.opseg button[aria-pressed="true"][data-op="neutral"]{background:var(--neu);color:var(--on-neu);font-weight:600}
.opseg button[aria-pressed="true"][data-op="opposite"]{background:var(--opp);color:var(--on-opp);font-weight:600}
.opseg.big{width:100%}
.opseg.big button{flex:1;padding:10px 4px;font-size:.92rem}

/* team */
details.ward{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.ward>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.ward>summary::-webkit-details-marker{display:none}
details.ward>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.ward[open]>summary::before{transform:rotate(45deg)}
details.ward .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.mlist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.member{display:flex;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.member:first-child{border-top:0}
.member .grow{flex:1 1 180px;min-width:0}
.member .t{font-weight:600;overflow-wrap:anywhere}
.member .m{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.role{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;background:var(--sunk);color:var(--muted);vertical-align:middle;margin-left:4px}
.role.ward_leader{background:var(--accent-soft);color:var(--accent)}
.role.mla{background:var(--accent);color:var(--accent-fg)}
.acts{display:flex;gap:4px;flex-wrap:wrap}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(10 8 16 / .45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:calc(100% - 16px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
@media (max-width:560px){.sheet-bg{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:92%;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cred{font-family:var(--mono);background:var(--sunk);border-radius:8px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.92rem}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:820px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.74rem;min-width:0}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}

/* login */
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:18px}
.login .mark{width:44px;height:44px}
.login .mark::after{inset:13px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}details.ward>summary::before{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty" style="margin-top:20vh"><div class="spin"></div></div></div>
<nav class="tabs" id="tabbar" hidden aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="sheet-bg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

async function doLogin(){

function donut(s){
  const R=60,C=2*Math.PI*R,gap=s.total>0?2:0;let off=0;
  const segs=OPS.map(k=>({k,v:s[k]})).filter(x=>x.v>0);
  const arcs=segs.map(x=>{const len=C*x.v/s.total;const d=Math.max(0,len-(segs.length>1?gap:0));const el=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--${({my_side:"my",neutral:"neu",opposite:"opp",unknown:"unk"})[x.k]})" stroke-width="22" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"><title>${esc(t(x.k))}: ${num(x.v)} (${pct(x.v,s.total)}%)</title></circle>`;off+=len;return el}).join("");
  return `<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="${esc(t("opinion"))}">
    ${s.total?"":`<circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--sunk)" stroke-width="22"/>`}${arcs}
    <text x="80" y="80" text-anchor="middle" font-size="26" font-weight="700">${pct(s.my_side,s.total)}%</text>
    <text x="80" y="98" text-anchor="middle" class="lbl">${esc(t("my_side"))}</text></svg>`;
}
function legend(s){

}
function stack(s){

}

/* ================= areas (lanes / sections from the electoral roll) ================= */
function splitSec(name){const n=String(name||"").trim();const m=n.match(/^(.*?)\s*H\.?\s*No\s*[.:]?\s*(.*)$/i);return m?{lane:m[1].trim(),hn:m[2].replace(/[,&\s]+$/,"").trim()}:{lane:n,hn:""}}
function areasFor(wid){
  const map=new Map(),out=[];
  for(const b of boothsIn(wid))for(const x of (b.sections||[])){
    const {lane,hn}=splitSec(x.name);const label=lane||`${t("lane")} ${x.no}`;
    const key=label.toLowerCase().replace(/[^a-z0-9\u0C80-\u0CFF]+/g,"")||("b"+b.part_no+"s"+x.no);
    let a=map.get(key);if(!a){a={key,lane:label,parts:[],hn:[],booths:[]};map.set(key,a);out.push(a)}

  }

function voterQuery(sel,opts){
  let q=S.sb.from("voters").select(sel,opts);

  if(A){if(W)q=q.eq("ward_id",W);q=q.or(A.parts.map(([b,n])=>`and(booth_id.eq.${b},section_no.eq.${Number(n)})`).join(","))}
  else if(S.vBooth)q=q.eq("booth_id",S.vBooth);else if(W)q=q.eq("ward_id",W);
  if(!A&&S.vBooth&&S.vSec)q=q.eq("section_no",Number(S.vSec));
  if(S.op)q=q.eq("opinion",S.op);
  const term=S.q.trim().replace(/[,()%*\\"':]/g," ").replace(/\s+/g," ").trim();
  if(term){const p=`%${term}%`;
    if(/^\d{1,4}$/.test(term))q=q.or(`serial_no.eq.${term},house_no.ilike.${term},house_no.ilike.${term}/%`);
    else if(/^\+?\d{5,}$/.test(term))q=q.or(`phone.ilike.%${term.replace("+","")}%,epic_no.ilike.${p}`);
    else q=q.or(`full_name.ilike.${p},epic_no.ilike.${p},house_no.ilike.${p}`)}
  return q;
}
let vReq=0;
async function loadVoters(reset){
  if(S.vmode==="areas"&&!S.area&&areasFor(isMla()?S.cw:S.me.ward_id).length){++vReq;S.vLoading=false;loadAreaSum();render();return}
  if(S.area)return loadArea();
  const my=++vReq;S.vLoading=true;if(reset){S.voters=[];render()}else render();
  let q=voterQuery("*",{count:"exact"});
  const PN=S.noPartNo?"booth_id":"part_no";
  if(S.sort==="roll")q=q.order(PN,{ascending:true,nullsFirst:false}).order("serial_no",{ascending:true,nullsFirst:false}).order("full_name");
  else if(S.sort==="house")q=q.order(PN,{ascending:true,nullsFirst:false}).order("house_no",{ascending:true,nullsFirst:false}).order("full_name");

  if(error){toast(errText(error));render();return}
  S.offline=false;
  S.voters=reset?data:S.voters.concat(data);S.vCount=count??S.voters.length;

async function setHouse(ids,op){

async function setOpinion(id,op){

function bumpSummary(ward,prev,next,booth,sec){
  if(prev===next)return;
  for(const r of [S.summary.find(x=>x.ward_id===ward),booth&&S.boothSum.find(x=>x.booth_id===booth),booth&&sec&&S.areaSum.find(x=>x.booth_id===booth&&x.section_no===sec)])
    if(r){r[prev]=Math.max(0,Number(r[prev])-1);r[next]=Number(r[next])+1}
  if(S.tab==="voters")render();
  refreshSummarySoon();
}

/* csv */
function parseCsv(text){
  const rows=[];let row=[],f="",q=false;text=text.replace(/^﻿/,"");
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
const COLS={full_name:/^(full[ _]?name|name|voter[ _]?name|ಹೆಸರು)$/i,house_no:/^(house[ _]?(no|number)?|door[ _]?(no|number)?|ಮನೆ.*)$/i,age:/^(age|ವಯಸ್ಸು)$/i,gender:/^(gender|sex|ಲಿಂಗ)$/i,phone:/^(phone|mobile|phone[ _]?no|ಫೋನ್)$/i,epic_no:/^(epic|epic[ _]?no|voter[ _]?id|epic[ _]?number)$/i,opinion:/^(opinion|ಅಭಿಪ್ರಾಯ)$/i};
function mapGender(s){s=String(s||"").trim().toLowerCase();if(/^(m|male|ಪುರುಷ|ಪು)$/.test(s))return"male";if(/^(f|female|ಮಹಿಳೆ|ಸ್ತ್ರೀ|ಮ)$/.test(s))return"female";if(/^(o|other|t|tg|ಇತರೆ)$/.test(s))return"other";return null}
function mapOpinion(s){s=String(s||"").trim().toLowerCase();if(/my|our|ನಮ್ಮ|support|favour/.test(s))return"my_side";if(/neutral|ತಟಸ್ಥ/.test(s))return"neutral";if(/opp|against|ವಿರೋಧ/.test(s))return"opposite";return"unknown"}

let importRows=[];
async function readImport(file){
  const rows=parseCsv(await file.text());const head=(rows.shift()||[]).map(h=>h.trim());
  const idx={};for(const k in COLS){const i=head.findIndex(h=>COLS[k].test(h));if(i>=0)idx[k]=i}
  const info=$("im-info");
  if(idx.full_name==null){info.innerHTML=`<div class="note bad">${esc(t("noNameCol"))}</div>`;$("im-go").disabled=true;importRows=[];return}
  importRows=rows.map(r=>{const g=k=>idx[k]!=null?(r[idx[k]]||"").trim():"";const age=parseInt(g("age"));return {full_name:g("full_name"),house_no:g("house_no")||null,age:age>=18&&age<=125?age:null,gender:mapGender(g("gender")),phone:g("phone")||null,epic_no:g("epic_no").toUpperCase()||null,opinion:mapOpinion(g("opinion"))}}).filter(r=>r.full_name);
  info.innerHTML=`<div class="note"><b>${num(importRows.length)}</b> ${esc(t("rowsFound"))}</div>`;$("im-go").disabled=!importRows.length;
}
async function runImport(){
  const ward=isMla()?$("im-ward").value:S.me.ward_id;if(!ward||!importRows.length)return;
  const btn=$("im-go");btn.disabled=true;let done=0,ins=0;
  for(let i=0;i<importRows.length;i+=500){
    btn.textContent=`${t("importing")} ${pct(i,importRows.length)}%`;
    const chunk=importRows.slice(i,i+500).map(r=>({...r,ward_id:ward}));
    const {data,error}=await S.sb.from("voters").upsert(chunk,{onConflict:"epic_no",ignoreDuplicates:true}).select("id");
    if(error){$("im-info").innerHTML=`<div class="note bad">${esc(errText(error))} (${num(done)} ${esc(t("imported"))})</div>`;btn.textContent=t("doImport");btn.disabled=false;return}
    done+=chunk.length;ins+=(data||[]).length;
  }
  closeSheet();toast(`${t("imported")}: ${num(ins)} · ${num(done-ins)} ${t("skipped")}`);

async function runRollImport(){
  if(!rollData)return;
  const btn=$("roll-go"),info=$("roll-info");btn.disabled=true;
  const fail=e=>{info.innerHTML=`<div class="note bad">${esc(errText(e))}</div>`;btn.disabled=false;btn.textContent=t("doImport")};
  // 1. wards: one per place (existing booths keep the ward the MLA chose)
  const {data:exB,error:e1}=await S.sb.from("booths").select("id,part_no,ward_id");if(e1)return fail(e1);
  const {data:exW,error:e2}=await S.sb.from("wards").select("id,name");if(e2)return fail(e2);
  const wardByName=new Map(exW.map(w=>[w.name.trim().toLowerCase(),w.id]));
  const boothByPart=new Map(exB.map(b=>[b.part_no,b]));
  for(const b of rollData.booths){
    if(boothByPart.has(b.part_no))continue;
    const key=(b.place||"").trim().toLowerCase();
    if(!wardByName.has(key)){const {data,error}=await S.sb.from("wards").insert({name:b.place}).select().single();if(error)return fail(error);wardByName.set(key,data.id)}
  }
  // 2. booths
  let done=0;const total=rollData.booths.reduce((n,b)=>n+(b.voters||[]).length,0);
  for(const b of rollData.booths){
    const meta={part_no:b.part_no,place:b.place,polling_station:b.polling_station||null,ps_address:b.ps_address||null,post_office:b.post_office||null,police_station:b.police_station||null,pincode:b.pincode||null,sections:b.sections||[],roll_total:b.roll_total??null,roll_male:b.roll_male??null,roll_female:b.roll_female??null};
    let booth=boothByPart.get(b.part_no);
    if(booth){const {error}=await S.sb.from("booths").update(meta).eq("id",booth.id);if(error)return fail(error)}
    else{const {data,error}=await S.sb.from("booths").insert({...meta,ward_id:wardByName.get((b.place||"").trim().toLowerCase())}).select().single();if(error)return fail(error);booth=data;boothByPart.set(b.part_no,data)}
    // 3. voters (matched by voter ID so marked opinions are kept)
    const rows=(b.voters||[]).map(v=>({ward_id:booth.ward_id,booth_id:booth.id,serial_no:v.serial,section_no:v.section_no||null,full_name:v.name,relation:v.relation||null,relative_name:v.relative||null,house_no:v.house_no||null,age:v.age&&v.age>=18&&v.age<=125?v.age:null,gender:["male","female","other"].includes(v.gender)?v.gender:(v.gender==="third"?"other":null),epic_no:v.epic||null}));
    const withId=rows.filter(r=>r.epic_no),noId=rows.filter(r=>!r.epic_no);
    for(let i=0;i<withId.length;i+=500){
      const {error}=await S.sb.from("voters").upsert(withId.slice(i,i+500),{onConflict:"epic_no"});if(error)return fail(error);
      done+=Math.min(500,withId.length-i);btn.textContent=`${t("loading")} ${pct(done,total)}%`;
    }
    if(noId.length){
      const {data:have}=await S.sb.from("voters").select("serial_no").eq("booth_id",booth.id).is("epic_no",null);
      const seen=new Set((have||[]).map(x=>x.serial_no));const fresh=noId.filter(r=>!seen.has(r.serial_no));

      done+=noId.length;btn.textContent=`${t("loading")} ${pct(done,total)}%`;
    }
  }

}

/* ================= offline queue & cache ================= */
function cacheGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function cacheSet(k,v,isList){try{
  if(isList){let keys=cacheGet("cd.vkeys")||[];keys=keys.filter(x=>x!==k);keys.push(k);while(keys.length>15){try{localStorage.removeItem(keys.shift())}catch(e){}}localStorage.setItem("cd.vkeys",JSON.stringify(keys))}
  localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const isNet=e=>/fetch|network|Load failed/i.test(String(e?.message||e||""))||navigator.onLine===false;
function getQueue(){return cacheGet("cd.queue")||[]}
function enqueue(item){const q=getQueue();q.push({...item,at:Date.now()});cacheSet("cd.queue",q);S.offline=true;render()}
function applyQueue(list){const q=getQueue();if(!q.length)return;const byId=new Map(list.map(v=>[v.id,v]));
  for(const it of q){for(const id of (it.ids||[it.id])){const v=byId.get(id);if(!v)continue;if(it.k==="op")v.opinion=it.op;if(it.k==="voted")v.voted=it.v}}}
let flushing=false;
async function flushQueue(){
  if(flushing||!S.sb||!S.me)return;const q=getQueue();if(!q.length)return;
  flushing=true;let left=[...q];
  for(const it of q){
    const r=it.k==="op"?await S.sb.from("voters").update({opinion:it.op}).in("id",it.ids):await S.sb.from("voters").update({voted:it.v}).eq("id",it.id);
    if(r.error&&isNet(r.error))break;           // still offline: keep the rest
    left.shift();                               // sent (or refused by the rules: drop it)
    cacheSet("cd.queue",left);
  }
  flushing=false;
  if(!left.length){S.offline=false;toast(t("synced"));refreshSummarySoon();render()}
}
window.addEventListener("online",()=>flushQueue());
setInterval(()=>flushQueue(),30000);
function queueBanner(){const n=getQueue().length;return n?`<div class="note warn"><b>${num(n)}</b> ${esc(t("offlineQ"))}</div>`:(S.offline?`<div class="note warn">${esc(t("offlineList"))}</div>`:"")}

  const tu=S.turnout.find(x=>x.booth_id===S.pBooth);if(tu){tu.voted=Number(tu.voted)+(v?1:-1);const op=(fx||sv)?.opinion;if(op==="my_side")tu.supporters_voted=Number(tu.supporters_voted)+(v?1:-1)}
  render();
  const {error}=await S.sb.from("voters").update({voted:v}).eq("id",id);
  if(error&&isNet(error)){enqueue({k:"voted",id,v});return}
  if(error){toast(errText(error));return}
  toast(t("saved"));
}

/* ================= voter slip & history ================= */
function slipText(v){const b=boothById(v.booth_id)||{};
  return [`*${t("slipTitle")}*`,`${t("fullName")}: ${v.full_name}`,v.relative_name?relLine(v):"",v.epic_no?`${t("epic")}: ${v.epic_no}`:"",
    b.part_no?`${t("booth")}: ${b.part_no} — ${b.polling_station||""}`:"",v.serial_no?`${t("serial")}: ${v.serial_no}`:"",v.house_no?`${t("houseNo")}: ${v.house_no}`:""].filter(Boolean).join("\n")}
async function loadHistory(id){
  const box=$("vf-hist");if(!box)return;
  const {data,error}=await S.sb.from("voter_history").select("*").eq("voter_id",id).order("changed_at",{ascending:false}).limit(10);
  if(error||!$("vf-hist"))return;
  box.innerHTML=data.length?`<ul class="mlist">${data.map(h=>`<li class="member" style="padding-block:6px"><div class="grow"><div class="m">${esc(fmtTime(h.changed_at))} · ${esc(memberById(h.changed_by)?.full_name||"—")}</div><div>${h.field==="voted"?esc(h.new_value==="true"?t("hasVoted"):t("undoVoted")+" "+t("hasVoted")):`${esc(t(h.old_value))} → <b>${esc(t(h.new_value))}</b>`}</div></div></li>`).join("")}</ul>`:`<p class="sub" style="margin:0">${esc(t("noHistory"))}</p>`;
}

/* ================= backup ================= */
async function downloadBackup(btn){
  btn.disabled=true;const old=btn.textContent;btn.textContent=t("loading");
  try{
    const KEY={members:"user_id",settings:"key"};
    const get=async(tb)=>{const all=[];for(let f=0;;f+=1000){const {data,error}=await S.sb.from(tb).select("*").order(KEY[tb]||"id").range(f,f+999);if(error)throw error;all.push(...data);btn.textContent=`${t("loading")} ${tb} ${num(all.length)}`;if(data.length<1000)break}return all};
    const dump={app:t("app"),exported_at:new Date().toISOString()};
    for(const tb of ["wards","booths","members","issues","notices","settings","voters"])dump[tb]=await get(tb);
    const name=`saundatti-survey-backup-${new Date().toISOString().slice(0,10)}.json`;
    const json=JSON.stringify(dump);
    await saveFile(name,json,"application/json");
    await S.sb.from("settings").upsert({key:"last_backup",value:new Date().toISOString()});
    S.settings.last_backup=new Date().toISOString();toast(t("backupDone"));
  }catch(e){toast(errText(e))}
  btn.disabled=false;btn.textContent=old;render();
}
const backupDue=()=>{const lb=S.settings.last_backup;return !lb||(Date.now()-new Date(lb).getTime())>7*864e5};

/* sheet helpers */
let lastFocus=null;
function openSheet(html){lastFocus=document.activeElement;$("sheet").innerHTML=html;$("sheetbg").hidden=false;S.armed=null}
function closeSheet(){$("sheetbg").hidden=true;$("sheet").innerHTML="";S.armed=null;if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true})}catch(e){}}

/* ================= events ================= */
document.addEventListener("submit",ev=>{if(ev.target.id==="loginForm"){ev.preventDefault();doLogin()}if(ev.target.id==="p-form"){ev.preventDefault();findSerial()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("sheetbg").hidden)closeSheet()});
$("sheetbg").addEventListener("click",ev=>{if(ev.target.id==="sheetbg")closeSheet()});
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.lang){S.lang=d.lang;store("cd.lang",S.lang);S.me?render():(configured?viewLogin():viewNotConfigured());return}
  if("close" in d){closeSheet();return}
  if(d.tab){S.tab=d.tab;S.armed=null;store("cd.tab",S.tab);render();window.scrollTo(0,0);if(S.tab==="voters")loadVoters(true);if(S.tab==="polling"){S.pFound=null;loadPolling()}return}
  if(d.call){openExternal("tel:"+d.call.replace(/[^\d+]/g,""));return}
  if(d.pvote){setVoted(d.pvote,d.v==="1");return}
  if(d.ndel){if(S.armed!=="n:"+d.ndel){S.armed="n:"+d.ndel;render();return}S.armed=null;const {error}=await S.sb.from("notices").delete().eq("id",d.ndel);if(error){toast(errText(error));return}S.notices=S.notices.filter(n=>n.id!==d.ndel);render();return}
  if(b.id==="n-more"){S.showAllNotices=true;render();return}
  if(b.id==="n-post"){postNotice();return}
  if(b.id==="rep-share"){shareReport();return}
  if(b.id==="vf-slip"&&S.sheetVoter){openExternal("https://wa.me/?text="+encodeURIComponent(slipText(S.sheetVoter)));return}
  if(b.id==="bk-dl"){downloadBackup(b);return}
  if(b.id==="tg-save"){const v=parseInt($("tg-val").value);if(!(v>0))return;const {error}=await S.sb.from("settings").upsert({key:"daily_target",value:v});if(error){toast(errText(error));return}S.settings.daily_target=v;toast(t("saved"));render();return}
  if(b.id==="acct"){openAccount();return}
  if(b.id==="ac-out"){await S.sb.auth.signOut();S.me=null;closeSheet();viewLogin();return}
  if(b.id==="ac-save"){const pw=$("ac-pw").value;if(pw.length<6){$("ac-err").innerHTML=`<div class="note bad">${esc(t("E_PASSWORD_SHORT"))}</div>`;return}const {error}=await S.sb.auth.updateUser({password:pw});if(error){$("ac-err").innerHTML=`<div class="note bad">${esc(errText(error))}</div>`;return}closeSheet();toast(t("pwChanged"));return}
  // dashboard
  if(d.cw){setWard(d.cw);return}
  if(d.openfold){S.folds[d.openfold]=true;render();document.querySelector(`[data-fold="${d.openfold}"]`)?.scrollIntoView({behavior:"smooth"});return}
  if(d.dbooth){S.dashBooth=d.dbooth;S.secSum=[];render();window.scrollTo(0,0);const r=await S.sb.rpc("section_summary",{p_booth:d.dbooth});if(!r.error){S.secSum=r.data||[];render()}return}
  if(b.id==="dash-back"){S.dashBooth=null;render();refreshSummarySoon();return}
  // voters
  if(d.vmode){S.vmode=d.vmode;store("cd.vmode",d.vmode);S.area=null;S.q="";S.op="";loadVoters(true);return}
  if(d.area){S.areaScroll=window.scrollY;S.area={key:d.area};S.q="";S.op="";loadVoters(true);window.scrollTo(0,0);return}
  if(b.id==="a-back"){S.area=null;S.q="";S.op="";S.voters=[];render();loadAreaSum();window.scrollTo(0,S.areaScroll||0);return}
  if(d.vfilter){S.op=S.op===d.vfilter?"":d.vfilter;loadVoters(true);return}
  if(d.vop){setOpinion(d.vop,d.op);return}
  if(d.hop){setHouse(d.hop.split(","),d.op);return}
  if(d.vedit){openVoter(S.voters.find(v=>v.id===d.vedit));return}
  if(b.id==="v-add"){openVoter(null);return}
  if(b.id==="v-more"){loadVoters(false);return}
  if(b.id==="v-export"){exportCsv();return}
  if(b.id==="v-import"){openImport();return}
  if(b.id==="im-go"){runImport();return}
  if(b.id==="roll-go"){runRollImport();return}
  if(b.id==="vf-save"){saveVoter(d.id);return}
  if(b.id==="vf-del"){deleteVoter(d.id,b);return}
  if(d.pick){const box=b.parentElement;const was=b.getAttribute("aria-pressed")==="true";box.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));if(!was)b.setAttribute("aria-pressed","true");return}
  if(d.multi){b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"));return}
  // team
  if(b.id==="w-add"||b.id==="w-add2"){openWard(null);return}
  if(d.wedit){openWard(wardById(d.wedit));return}
  if(b.id==="wf-save"){saveWard(d.id);return}
  if(d.wdel){if(S.armed!=="w:"+d.wdel){S.armed="w:"+d.wdel;render();return}S.armed=null;const {error}=await S.sb.from("wards").delete().eq("id",d.wdel);if(error){toast(errText(error));render();return}S.wards=S.wards.filter(w=>w.id!==d.wdel);if(S.cw===d.wdel){S.cw="";const f=sortedWards()[0];if(f){S.cw=S.vWard=S.dashWard=f.id;store("cd.ward",f.id)}else{S.vWard="";S.dashWard=null}}render();return}
  if(d.addm){openMember(d.addm,d.w,null);return}
  if(d.medit){const m=memberById(d.medit);openMember(m.role,m.ward_id,m);return}
  if(b.id==="mf-gen"){$("mf-pw").value=genPw();return}
  if(b.id==="mf-save"){saveMember(b);return}
  if(d.mpw){openResetPw(memberById(d.mpw));return}
  if(b.id==="rp-gen"){$("rp-pw").value=genPw();return}
  if(b.id==="rp-save"){saveResetPw(d.id);return}
  if(d.mrm){if(S.armed!=="m:"+d.mrm){S.armed="m:"+d.mrm;render();return}S.armed=null;setActive(d.mrm,false);return}
  if(d.mrestore){setActive(d.mrestore,true);return}
  // issues
  if(d.issave){const id=d.issave;const body={en:$("is-en-"+id).value.trim(),kn:$("is-kn-"+id).value.trim()};if(!body.en&&!body.kn)return;if(!body.en)body.en=body.kn;const {error}=await S.sb.from("issues").update(body).eq("id",id);if(error){toast(errText(error));return}Object.assign(S.issues.find(i=>i.id===id),body);toast(t("saved"));return}
  if(d.isdel){if(S.armed!=="i:"+d.isdel){S.armed="i:"+d.isdel;render();return}S.armed=null;const {error}=await S.sb.from("issues").delete().eq("id",d.isdel);if(error){toast(errText(error));return}S.issues=S.issues.filter(i=>i.id!==d.isdel);render();return}
  if(b.id==="is-add"){const kn=$("is-new-kn").value.trim(),en=$("is-new-en").value.trim()||kn;if(!en)return;const {data,error}=await S.sb.from("issues").insert({en,kn,sort:(S.issues.at(-1)?.sort||0)+1}).select().single();if(error){toast(errText(error));return}S.issues.push(data);render();return}
});
document.addEventListener("toggle",ev=>{const d=ev.target;if(!d||!d.dataset)return;if(d.dataset.fold)S.folds[d.dataset.fold]=d.open;if(d.dataset.ward){S.openWards=S.openWards||{};S.openWards[d.dataset.ward]=d.open}if(d.dataset.removed!=null)S.openRemoved=d.open},true);
let qT;
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="v-q"){S.q=el.value;clearTimeout(qT);qT=setTimeout(()=>loadVoters(true),350)}
  if(el.id==="a-q"){S.aq=el.value;render()}
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="p-booth"){S.pBooth=el.value;S.pFound=null;S.pSup=[];render();loadPolling()}
  else if(el.id==="v-booth"){S.vBooth=el.value;S.vSec="";loadVoters(true)}
  else if(el.id==="v-sec"){S.vSec=el.value;loadVoters(true)}
  else if(el.dataset.bmove){moveBooth(el.dataset.bmove,el.value)}
  else if(el.id==="v-sort"){S.sort=el.value;loadVoters(true)}
  else if(el.id==="im-file"&&el.files[0])readImport(el.files[0]);
  else if(el.id==="roll-file"&&el.files[0])readRoll(el.files[0]);
  else if(el.id==="vf-booth"){const vb=boothById(el.value);const box=el.closest(".row");box.querySelector("#vf-sec")?.closest("label")?.remove();if(vb&&(vb.sections||[]).length){box.insertAdjacentHTML("beforeend",`<label class="f">${esc(t("lane"))}<select id="vf-sec"><option value="">—</option>${vb.sections.map(x=>`<option value="${x.no}">${x.no}. ${esc(secName(vb,x.no))}</option>`).join("")}</select></label>`)}}
});

/* Android back button: close a sheet, then return to the dashboard, then leave the app */
window.appBack=function(){
  if(!$("sheetbg").hidden){closeSheet();return true}
  if(S.me&&S.tab==="voters"&&S.area){S.area=null;S.q="";S.op="";S.voters=[];render();loadAreaSum();window.scrollTo(0,S.areaScroll||0);return true}
  if(S.me&&S.tab!=="dashboard"){S.tab="dashboard";render();window.scrollTo(0,0);return true}
  if(S.me&&S.dashBooth){S.dashBooth=null;render();return true}

  return false;
};
